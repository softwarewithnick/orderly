name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Pinned via requirements.txt so a new ruff release cannot turn CI red on
      # a commit that did not change any code.
      - name: Lint
        run: ruff check

      - name: Test
        run: pytest -q
